[project]
name = "data-science-path-api"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.6,<3",
  "pyjwt>=2.10,<3", "pwdlib[argon2]>=0.2,<1", "email-validator>=2.2,<3",
  "python-multipart>=0.0.17,<1", "anyio>=4.6,<4.10"
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "httpx>=0.28,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
