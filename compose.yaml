services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dsp}
      POSTGRES_USER: ${POSTGRES_USER:-dsp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dsp-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dsp} -d ${POSTGRES_DB:-dsp}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./apps/api
    environment:
      DSP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dsp}:${POSTGRES_PASSWORD:-dsp-local-only}@db:5432/${POSTGRES_DB:-dsp}
      DSP_SECRET_KEY: ${DSP_SECRET_KEY:-local-development-secret-change-me}
      DSP_FRONTEND_URL: http://localhost:3000
      DSP_SECURE_COOKIES: "false"
    depends_on:
      db: {condition: service_healthy}
    command: ["sh","-c","alembic upgrade head && python -m app.data.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"]
    ports: ["8000:8000"]
  web:
    build:
      context: ./apps/web
      args: {API_INTERNAL_URL: "http://api:8000"}
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  postgres_data:

